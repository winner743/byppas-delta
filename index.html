<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Link Auto-Bypass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
        .btn-auto {
            background-color: #16a34a;
        }
        .btn-auto:hover {
            background-color: #15803d;
        }
        #status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
            word-break: break-word;
        }
        .success {
            background-color: #064e3b;
            color: #6ee7b7;
        }
        .loading {
            background-color: #1e3a8a;
            color: #93c5fd;
        }
        .error {
            background-color: #7f1d1d;
            color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Delta Auto Bypass</h2>
    <p>Salin link step Delta, lalu klik tombol di bawah untuk langsung menuju halaman generate key.</p>
    
    <input type="text" id="linkInput" placeholder="Tempel link step Delta di sini..." />
    
    <div class="btn-group">
        <button class="btn-auto" onclick="pasteAndBypass()">Tempel & Auto Bypass</button>
        <button onclick="bypassLink()">Bypass Manual</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function pasteAndBypass() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                document.getElementById('linkInput').value = text;
                bypassLink();
            } else {
                showStatus('Papan klip (clipboard) kosong!', 'error');
            }
        } catch (err) {
            showStatus('Gagal membaca clipboard secara otomatis. Silakan tempel manual ke kolom input.', 'error');
        }
    }

    async function bypassLink() {
        const urlInput = document.getElementById('linkInput').value.trim();
        if (!urlInput) {
            showStatus('Masukkan link step Delta terlebih dahulu.', 'error');
            return;
        }

        showStatus('Memproses bypass link...', 'loading');

        try {
            // Mengirim request ke API bypass publik untuk memproses ad-link (Linkvertise/Work.ink/Platoboost)
            const response = await fetch(`https://api.bypass.vip/bypass?url=${encodeURIComponent(urlInput)}`);
            const data = await response.json();

            if (data && (data.result || data.destination)) {
                const targetUrl = data.result || data.destination;
                showStatus('Bypass berhasil! Mengalihkan ke halaman key...', 'success');
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1200);
            } else {
                // Fallback ekstrasi HWID/Token jika API eksternal gagal
                const fallbackUrl = processDirectToken(urlInput);
                if (fallbackUrl) {
                    showStatus('Fallback berhasil! Mengalihkan...', 'success');
                    setTimeout(() => {
                        window.location.href = fallbackUrl;
                    }, 1000);
                } else {
                    showStatus('Gagal melakukan bypass. Link tidak valid atau tidak didukung.', 'error');
                }
            }
        } catch (error) {
            const fallbackUrl = processDirectToken(urlInput);
            if (fallbackUrl) {
                showStatus('Mengalihkan lewat fallback direct token...', 'success');
                setTimeout(() => {
                    window.location.href = fallbackUrl;
                }, 1000);
            } else {
                showStatus('Koneksi ke API bypass gagal. Coba beberapa saat lagi.', 'error');
            }
        }
    }

    function processDirectToken(url) {
        try {
            const parsed = new URL(url);
            const id = parsed.searchParams.get('id') || parsed.searchParams.get('hwid') || parsed.searchParams.get('r');
            if (id) {
                return `https://gateway.platoboost.com/a/8?id=${id}`;
            }
        } catch (e) {
            return null;
        }
        return null;
    }

    function showStatus(message, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = message;
        statusDiv.className = type;
        statusDiv.style.display = 'block';
    }
</script>

</body>
</html>
