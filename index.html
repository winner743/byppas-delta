<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Link Auto-Bypass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #161b22;
            border: 1px solid #30363d;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 8px;
            font-size: 22px;
        }
        p {
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
            color: #f0f6fc;
            font-size: 14px;
            margin-bottom: 15px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-primary {
            background-color: #238636;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #2ea043;
        }
        .btn-secondary {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-secondary:hover {
            background-color: #30363d;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
            word-break: break-word;
        }
        .info { background-color: #1f6beb22; color: #58a6ff; border: 1px solid #1f6beb; }
        .success { background-color: #23863622; color: #3fb950; border: 1px solid #238636; }
        .error { background-color: #da363322; color: #f85149; border: 1px solid #da3633; }
    </style>
</head>
<body>

<div class="container">
    <h2>Delta Auto Bypass</h2>
    <p>Tempelkan link step Delta (Platoboost / Linkvertise / Work.ink) di bawah ini.</p>
    
    <input type="text" id="urlInput" placeholder="https://gateway.platoboost.com/..." />
    
    <div class="btn-group">
        <button class="btn-primary" onclick="autoPasteAndBypass()">Paste & Bypass</button>
        <button class="btn-secondary" onclick="startBypass()">Process</button>
    </div>

    <div id="status"></div>
</div>

<script>
    async function autoPasteAndBypass() {
        try {
            const text = await navigator.clipboard.readText();
            if (text) {
                document.getElementById('urlInput').value = text;
                startBypass();
            } else {
                setStatus('Clipboard kosong, tempel link secara manual.', 'error');
            }
        } catch (err) {
            setStatus('Izin clipboard ditolak. Silakan tempel link manual ke kolom.', 'error');
        }
    }

    async function startBypass() {
        const inputUrl = document.getElementById('urlInput').value.trim();
        if (!inputUrl) {
            setStatus('Masukkan link Delta terlebih dahulu!', 'error');
            return;
        }

        setStatus('Mencoba Server 1 (Fast Bypass)...', 'info');

        // Daftar API Bypass Publik untuk Delta / Linkvertise / Platoboost
        const apiEndpoints = [
            `https://api.bypass.vip/bypass?url=${encodeURIComponent(inputUrl)}`,
            `https://bypass.bot.nu/bypass2?url=${encodeURIComponent(inputUrl)}`,
            `https://ethon-bypass-api.vercel.app/api/bypass?url=${encodeURIComponent(inputUrl)}`
        ];

        let resultUrl = null;

        for (let i = 0; i < apiEndpoints.length; i++) {
            try {
                if (i > 0) setStatus(`Mencoba Server Cadangan ${i + 1}...`, 'info');
                
                const res = await fetch(apiEndpoints[i]);
                const data = await res.json();

                if (data && (data.result || data.destination || data.url)) {
                    resultUrl = data.result || data.destination || data.url;
                    break;
                }
            } catch (e) {
                console.log(`Server ${i+1} gagal, mencoba server berikutnya...`);
            }
        }

        // Jika semua API gagal, coba ekstrak ID Platoboost secara langsung
        if (!resultUrl) {
            resultUrl = extractDirectPlatoboost(inputUrl);
        }

        if (resultUrl) {
            setStatus('Bypass Berhasil! Mengalihkan ke halaman Key...', 'success');
            setTimeout(() => {
                window.location.href = resultUrl;
            }, 1000);
        } else {
            setStatus('Gagal melakukan bypass. Pastikan link yang dimasukkan adalah link Delta/Platoboost yang valid.', 'error');
        }
    }

    function extractDirectPlatoboost(url) {
        try {
            const u = new URL(url);
            const id = u.searchParams.get("id") || u.searchParams.get("hwid");
            if (id) {
                return `https://gateway.platoboost.com/a/8?id=${id}`;
            }
        } catch (e) {
            return null;
        }
        return null;
    }

    function setStatus(text, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = text;
        statusDiv.className = type;
        statusDiv.style.display = 'block';
    }
</script>

</body>
</html>
